    pin: GPIO22

sensor:
  - platform: dallas_temp
    name: "Temperatura Ladrillos (real)"
    id: temp_ladrillos
    icon: "mdi:temperature-celsius"
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      - offset: 0.2
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
    on_value:
      then:
        - lambda: |-
            const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
            if (isnan(x)) {
              if (!id(debug_mode)) {
                id(temp_used_internal).publish_state(NAN);
                id(last_temp_internal_valid_ms) = 0;
              }
              return;
            }

            if (!id(debug_mode)) {
              id(temp_used_internal).publish_state(x);
              id(last_temp_internal_valid_ms) = now;
            }
        - if:
            condition:
              lambda: 'return !id(debug_mode);'
            then:
              - script.execute: update_stored_soc

  - platform: dht
    pin: GPIO10
    model: DHT22
    temperature:
      id: temp_room
      name: "Temperatura Habitación (real)"
      icon: "mdi:temperature-celsius"
      accuracy_decimals: 1
      filters:
        - offset: -1
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1
      on_value:
        then:
          - lambda: |-
              const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
              if (isnan(x)) {
                if (!id(debug_mode)) {
                  id(temp_used_external).publish_state(NAN);
                  id(last_temp_external_valid_ms) = 0;
                }
                return;
              }

              if (!id(debug_mode)) {
                id(temp_used_external).publish_state(x);
                id(last_temp_external_valid_ms) = now;
              }
    humidity:
      id: humidity_room
      name: "Humedad Habitación (real)"
      icon: "mdi:water-percent"
      unit_of_measurement: "%"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1
      on_value:
        then:
          - lambda: |-
              if (isnan(x)) {
                id(last_humidity_valid_ms) = 0;
              } else {
                id(last_humidity_valid_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
              }
    update_interval: 10s

  - platform: template
    name: "Temperatura ambiente usada"
    id: temp_used_external
    icon: "mdi:temperature-celsius"
    accuracy_decimals: 1

  - platform: template
    name: "Temperatura ladrillos usada"
    id: temp_used_internal
    icon: "mdi:temperature-celsius"
    accuracy_decimals: 1

  - platform: template
    name: "Nivel Descarga (reportado)"
    id: level_reported
    icon: "mdi:arrow-collapse"
    accuracy_decimals: 0

  - platform: template
    name: "% Apertura (real)"
    id: open_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Recorrido calibrado de trampilla"
    id: calibrated_travel_sensor
    unit_of_measurement: "steps"
    icon: "mdi:ruler"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Carga acumulador (%)"
    id: stored_soc_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"

  - platform: template
    name: "Temperatura objetivo remota"
    id: remote_temp_target_sensor
    accuracy_decimals: 1
    icon: "mdi:temperature-celsius"

# -------------------- Stepper NEMA17 + TMC2209 (STEP/DIR) --------------------
stepper:
  - platform: a4988
    id: motor
    step_pin: GPIO19
    dir_pin: GPIO18

    # En TMC2209 el pin es EN (ENABLE) en lugar de SLEEP.
    # ESPHome usa "sleep_pin" para dormir al terminar; en TMC hay que INVERTIRLO.
    # Con esto replicas tu "sleep_when_done: true" (se deshabilita al llegar al target).
    sleep_pin:
      number: GPIO20
      inverted: true

    max_speed: 250 steps/s
    acceleration: 600 steps/s^2
    deceleration: 600 steps/s^2

# -------------------- Controles HA --------------------
switch:
  - platform: template
    name: "Debug Mode"
    id: debug_switch
    icon: "mdi:test-tube"
    lambda: |-
      return id(debug_mode);
    turn_on_action:
      - lambda: |-
          id(debug_mode) = true;
          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          id(last_auto_ms) = 0;
          id(temp_used_external).publish_state(id(fake_external_temp).state);
          id(temp_used_internal).publish_state(id(fake_internal_temp).state);
          id(last_temp_external_valid_ms) = now;
          id(last_temp_internal_valid_ms) = now;
          ESP_LOGW("CTRL", "DEBUG ON");
      - script.execute: update_stored_soc
    turn_off_action:
      - lambda: |-
          id(debug_mode) = false;
          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          id(last_auto_ms) = 0;
          if (id(temp_room).has_state() && !isnan(id(temp_room).state)) {
            id(temp_used_external).publish_state(id(temp_room).state);
            id(last_temp_external_valid_ms) = now;
          } else {
            id(temp_used_external).publish_state(NAN);
            id(last_temp_external_valid_ms) = 0;
          }
          if (id(temp_ladrillos).has_state() && !isnan(id(temp_ladrillos).state)) {
            id(temp_used_internal).publish_state(id(temp_ladrillos).state);
            id(last_temp_internal_valid_ms) = now;
          } else {
            id(temp_used_internal).publish_state(NAN);
            id(last_temp_internal_valid_ms) = 0;
          }
          ESP_LOGW("CTRL", "DEBUG OFF");
      - script.execute: update_stored_soc

select:
  - platform: template
    name: "Modo de funcionamiento"
    id: operating_mode
    icon: "mdi:thermostat-auto"
    optimistic: true
    restore_value: true
    initial_option: "AUTO_LOCAL"
    options:
      - "MANUAL"
      - "AUTO_LOCAL"
      - "AUTO_REMOTO"
    set_action:
      - lambda: |-
          id(last_auto_ms) = 0;
          id(last_telemetry_ms) = 0;
          id(remote_discharge_enabled) = false;
          id(remote_setpoint_valid) = false;
          id(last_remote_message_ms) = 0;
          ESP_LOGW("CTRL", "Modo=%s", x.c_str());

          if (x == "AUTO_REMOTO") {
            id(force_remote_close)->execute();
          }

