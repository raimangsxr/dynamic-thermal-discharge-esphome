substitutions:
  name: "heater-salon"
  friendly_name: "Acumulador Salón Test"
  lan_private_ip: "192.168.11.101"
  #wg_private_ip: "10.8.0.23"

  # ---- Calibración mecánica ----
  steps_level_5: "2500"   # pasos desde nivel 0 (cerrado) a nivel 5 (abierto)

  # ---- Control térmico ----
  temp_target_default: "21.0"
  temp_target_min: "18"
  temp_target_max: "25"
  hysteresis: "0.4"       # °C (banda muerta)
  step_band: "0.4"        # °C por nivel (agresividad)

  # ---- MQTT ----
  mqtt_setpoint_topic: "telemetria/acumuladores/${name}/setpoint"
  mqtt_discharge_topic: "telemetria/acumuladores/${name}/discharge"
  mqtt_telemetry_topic: "telemetria/acumuladores/${name}/telemetry"

  # ---- Estado de carga térmica ----
  brick_temp_soc_min_default: "20.0"   # 0 % de carga
  brick_temp_soc_max_default: "120.0"  # 100 % de carga; cerca del límite del DS18B20

  # ---- Endstops / Homing ----
  endstop_debounce: "30ms"
  homing_extra_steps: "600"     # “pasos de más” para asegurar tocar el endstop
  motion_timeout_s: "30"        # timeout seguridad para HOMING/RESTORE
  sensor_stale_timeout_s: "60"  # edad máxima admisible de una medida de control
  remote_lease_timeout_s: "90"  # el controlador remoto debe renovar su permiso

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Clamp del último nivel persistido
          int lvl = id(saved_level);
          if (lvl < 0) lvl = 0;
          if (lvl > 5) lvl = 5;
          id(saved_level) = lvl;

          // DEBUG es deliberadamente no persistente, pero inicializamos las
          // señales derivadas por si se activa desde otra automatización.
          if (id(debug_mode)) {
            const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
            id(temp_used_external).publish_state(id(fake_external_temp).state);
            id(temp_used_internal).publish_state(id(fake_internal_temp).state);
            id(last_temp_external_valid_ms) = now;
            id(last_temp_internal_valid_ms) = now;
          }

          // Nivel a restaurar tras homing (en boot o recalibración)
          id(boot_restore_level) = lvl;

          ESP_LOGW("BOOT", "Boot: homing a cerrado; AUTO_REMOTO esperara MQTT antes de abrir (nivel=%d)", lvl);

          // Bloquea auto/manual hasta terminar secuencia
          id(motion_state) = 1;  // 0=READY, 1=HOMING, 2=RESTORING, 3=FAULT
          id(motion_state_since_ms) = (uint32_t)(millis() & 0xFFFFFFFF);

      - delay: 500ms
      - script.execute: home_to_closed

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Madrid

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_ap_password
#  manual_ip:
#    static_ip: ${lan_private_ip}
#    gateway: 192.168.11.1
#    subnet: 255.255.255.0

captive_portal:

# Reservado para una futura activación de WireGuard.
# wireguard:
#   address: ${wg_private_ip}
#   private_key: !secret wg_private_key_heater
#   peer_endpoint: !secret wg_peer_endpoint
#   peer_port: !secret wg_peer_port
#   peer_public_key: !secret wg_peer_public_key
#   peer_preshared_key: !secret wg_preshared_key_heater
#   peer_allowed_ips:
#     - 10.8.0.0/24
#   peer_persistent_keepalive: !secret wg_peer_persistent_keepalive
#   netmask: 255.255.255.0

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: null
  discovery: false
  reboot_timeout: 0s
  on_connect:
    - lambda: |-
        id(last_telemetry_ms) = 0;
        ESP_LOGI("MQTT", "Conectado al broker");
    - script.execute: publish_remote_telemetry
  on_disconnect:
    - lambda: |-
        id(remote_discharge_enabled) = false;
        id(remote_setpoint_valid) = false;
        id(last_remote_message_ms) = 0;
        id(last_auto_ms) = 0;
        id(last_telemetry_ms) = 0;
        ESP_LOGW("MQTT", "Broker desconectado: invalido estado remoto");
    - script.execute: force_remote_close
  on_message:
    - topic: ${mqtt_setpoint_topic}
      qos: 1
      then:
        - lambda: |-
            char *end = nullptr;
            const float value = strtof(x.c_str(), &end);
            while (end != nullptr && (*end == ' ' || *end == '\t' || *end == '\r' || *end == '\n')) {
              end++;
            }

            if (end == x.c_str() || (end != nullptr && *end != '\0') || isnan(value) ||
                value < atof("${temp_target_min}") || value > atof("${temp_target_max}")) {
              id(remote_setpoint_valid) = false;
              id(last_remote_message_ms) = 0;
              ESP_LOGW("MQTT", "Setpoint invalido: '%s'", x.c_str());
              id(last_auto_ms) = 0;
              return;
            }

            id(remote_temp_target) = value;
            id(remote_setpoint_valid) = true;
            id(last_remote_message_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
            id(remote_temp_target_sensor).publish_state(value);
            id(last_auto_ms) = 0;
            ESP_LOGI("MQTT", "Setpoint remoto=%.1f C", value);
        - script.execute: force_remote_close

    - topic: ${mqtt_discharge_topic}
      qos: 1
      then:
        - lambda: |-
            std::string payload = x;
            for (char &c : payload) {
              if (c >= 'a' && c <= 'z') c = (char)(c - 'a' + 'A');
            }

            if (payload == "OFF") {
              id(remote_discharge_enabled) = false;
              id(remote_setpoint_valid) = false;
              id(last_remote_message_ms) = 0;
              id(last_auto_ms) = 0;
              ESP_LOGW("MQTT", "Discharge remoto=OFF");
              return;
            }

            if (payload == "ON") {
              id(remote_discharge_enabled) = true;
              id(last_remote_message_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
              id(last_auto_ms) = 0;
              ESP_LOGI("MQTT", "Discharge remoto=ON (setpoint_valido=%s)",
                       id(remote_setpoint_valid) ? "si" : "no");
              return;
            }

            id(remote_discharge_enabled) = false;
            id(remote_setpoint_valid) = false;
            id(last_remote_message_ms) = 0;
            id(last_auto_ms) = 0;
            ESP_LOGW("MQTT", "Discharge invalido: '%s'", x.c_str());
        - script.execute: force_remote_close

globals:
  # Debug mantiene el comportamiento anterior: sustituye las temperaturas
  # medidas por las temperaturas simuladas.
  - id: debug_mode
    type: bool
    restore_value: false
    initial_value: "false"

  # Estado recibido por MQTT en AUTO_REMOTO.
  - id: remote_discharge_enabled
    type: bool
    restore_value: false
    initial_value: "false"

  - id: remote_setpoint_valid
    type: bool
    restore_value: false
    initial_value: "false"

  - id: remote_temp_target
    type: float
    restore_value: false
    initial_value: "21.0"

  # Momento de la última orden remota válida; evita permisos indefinidos.
  - id: last_remote_message_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Marcas de frescura de las temperaturas reales y de las señales usadas.
  - id: last_temp_external_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_temp_internal_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_temp_room_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_temp_ladrillos_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Control AUTO (gating por periodo)
  - id: last_auto_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Telemetría MQTT (gating por periodo)
  - id: last_telemetry_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Persistencia de nivel (último nivel comandado)
  - id: saved_level
    type: int
    restore_value: true
    initial_value: "0"

  # Nivel que se restaura tras homing (boot/recalibración)
  - id: boot_restore_level
    type: int
    restore_value: false
    initial_value: "0"

  # Estado de movimiento:
  # 0=READY, 1=HOMING, 2=RESTORING, 3=FAULT (requiere recalibración)
  - id: motion_state
    type: int
    restore_value: false
    initial_value: "1"

  - id: motion_state_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: motion_fault
    type: bool
    restore_value: false
    initial_value: "false"

# -------------------- Scripts (núcleo de control) --------------------
script:
  # Mueve a un nivel (0..5) + publica estado + persiste saved_level
  - id: set_level
    mode: restart
    parameters:
      lvl: int
    then:
      - lambda: |-
          int level = lvl;
          if (level < 0) level = 0;
          if (level > 5) level = 5;

          if (id(motion_fault) || id(motion_state) == 3) {
            ESP_LOGE("POS", "Movimiento bloqueado: requiere recalibracion");
            return;
          }

          // En AUTO_REMOTO, el estado MQTT remoto tiene prioridad y fuerza
          // el nivel 0 mientras no haya permiso y setpoint válidos.
          if (id(operating_mode).current_option() == "AUTO_REMOTO" &&
              (!id(remote_discharge_enabled) || !id(remote_setpoint_valid))) {
            level = 0;
          }

          const int steps5 = atoi("${steps_level_5}");
          const int target_steps = (int) lroundf(level * (steps5 / 5.0f));

          ESP_LOGI("POS", "set_level(%d) -> target_steps=%d", level, target_steps);

          id(motor).set_target(target_steps);

          id(saved_level) = level;
          id(level_reported).publish_state(level);
          id(level_manual).publish_state(level);

  # Fuerza el cierre solo cuando el modo remoto no tiene permiso completo.
  # Durante HOMING dejamos que el motor termine de buscar el final cerrado.
  - id: force_remote_close
    mode: restart
    then:
      - lambda: |-
          if (id(operating_mode).current_option() != "AUTO_REMOTO") return;
          if (id(motion_fault) || id(motion_state) == 3) {
            ESP_LOGE("MQTT", "Cierre remoto bloqueado: requiere recalibracion");
            return;
          }
          if (id(remote_discharge_enabled) && id(remote_setpoint_valid)) return;

          if (id(motion_state) == 1) {
            ESP_LOGW("MQTT", "Cierre remoto pendiente: homing en curso");
            return;
          }

          if (id(motor).current_position != 0 || id(motor).target_position != 0 || id(saved_level) != 0) {
            ESP_LOGW("MQTT", "Cierre remoto forzado");
            id(set_level)->execute(0);
          }

  # Calcula el estado de carga térmica a partir de la temperatura real de los
  # ladrillos y de los dos límites configurables en Home Assistant.
  - id: update_stored_soc
    mode: restart
    then:
      - lambda: |-
          if (!id(temp_ladrillos).has_state() || isnan(id(temp_ladrillos).state)) {
            return;
          }

          const float temp_min = id(brick_temp_soc_min).state;
          const float temp_max = id(brick_temp_soc_max).state;

          if (isnan(temp_min) || isnan(temp_max) || temp_max <= temp_min) {
            ESP_LOGE("SOC", "Limites SOC invalidos: min=%.1f max=%.1f", temp_min, temp_max);
            id(stored_soc_percent).publish_state(NAN);
            return;
          }

          float soc = ((id(temp_ladrillos).state - temp_min) / (temp_max - temp_min)) * 100.0f;
          if (soc < 0.0f) soc = 0.0f;
          if (soc > 100.0f) soc = 100.0f;

          id(stored_soc_percent).publish_state(lroundf(soc));

  # Publica la telemetría remota con valores físicos actuales.
  - id: publish_remote_telemetry
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(operating_mode).current_option() == "AUTO_REMOTO";'
          then:
            - if:
                condition:
                  lambda: 'return id(mqtt_client)->is_connected();'
                then:
                  - if:
                      condition:
                        lambda: |-
                          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                          const uint32_t timeout_ms =
                              (uint32_t)(atoi("${sensor_stale_timeout_s}") * 1000UL);
                          return id(temp_room).has_state() && !isnan(id(temp_room).state) &&
                                 id(last_temp_room_valid_ms) != 0 &&
                                 now - id(last_temp_room_valid_ms) <= timeout_ms &&
                                 id(stored_soc_percent).has_state() &&
                                 !isnan(id(stored_soc_percent).state) &&
                                 id(last_temp_ladrillos_valid_ms) != 0 &&
                                 now - id(last_temp_ladrillos_valid_ms) <= timeout_ms;
                      then:
                        - mqtt.publish_json:
                            topic: ${mqtt_telemetry_topic}
                            qos: 0
                            retain: false
                            payload: |-
                              const int steps5 = atoi("${steps_level_5}");
                              float damper_pct = 0.0f;
                              if (steps5 > 0) {
                                damper_pct = ((float) id(motor).current_position * 100.0f) / steps5;
                              }
                              if (damper_pct < 0.0f) damper_pct = 0.0f;
                              if (damper_pct > 100.0f) damper_pct = 100.0f;

                              root["indoor_temperature_c"] = lroundf(id(temp_room).state * 10.0f) / 10.0f;
                              root["stored_soc_percent"] = (int) lroundf(id(stored_soc_percent).state);
                              root["damper_position_percent"] = (int) lroundf(damper_pct);
                      else:
                        - logger.log:
                            level: DEBUG
                            tag: MQTT
                            format: "Telemetria omitida: faltan sensores validos"
                else:
                  - logger.log:
                      level: DEBUG
                      tag: MQTT
                      format: "Telemetria omitida: MQTT desconectado"

  # Ancla la posición interna del stepper (report_position + set_target) para evitar movimientos raros
  - id: anchor_steps
    mode: restart
    parameters:
      steps: int
    then:
      - lambda: |-
          id(motor).report_position(steps);
          id(motor).set_target(steps);

  # Inicia homing hacia cerrado (nivel 0). Si ya está cerrado, dispara directamente “cerrado alcanzado”.
  - id: home_to_closed
    mode: restart
    then:
      - lambda: |-
          id(motion_fault) = false;
          id(motion_state) = 1; // HOMING
          id(motion_state_since_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
          ESP_LOGW("HOME", "Homing hacia cerrado...");

      - if:
          condition:
            binary_sensor.is_on: endstop_closed
          then:
            - script.execute: on_closed_endstop
          else:
            - stepper.set_target:
                id: motor
                target: !lambda |-
                  const int steps5 = atoi("${steps_level_5}");
                  const int extra = atoi("${homing_extra_steps}");
                  return -(steps5 + extra);

  # Handler del endstop cerrado:
  # - en AUTO_REMOTO: termina en 0 y espera el permiso/setpoint MQTT
  # - en otros modos: restaura boot_restore_level como antes
  # - si estamos en normal: ancla a 0 y fija nivel 0 (sin “restore”)
  - id: on_closed_endstop
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);

          // Ancla físico -> pasos 0
          ESP_LOGW("ENDSTOP", "CERRADO activado (motion_state=%d) -> anchor a 0", id(motion_state));
          id(last_auto_ms) = now; // evita auto inmediato cuando se libere

      - script.execute:
          id: anchor_steps
          steps: 0

      - if:
          condition:
            lambda: 'return id(motion_state) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(operating_mode).current_option() == "AUTO_REMOTO";'
                then:
                  - script.execute:
                      id: set_level
                      lvl: 0
                  - lambda: |-
                      id(motion_state) = 0;
                      id(last_auto_ms) = 0;
                      ESP_LOGW("HOME", "Cerrado alcanzado en AUTO_REMOTO -> espero MQTT");
                else:
                  - lambda: |-
                      const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                      id(motion_state) = 2; // RESTORING
                      id(motion_state_since_ms) = now;
                      ESP_LOGW("HOME", "Cerrado alcanzado -> restauro nivel=%d", id(boot_restore_level));
                  - script.execute:
                      id: set_level
                      lvl: !lambda 'return id(boot_restore_level);'
          else:
            - script.execute:
                id: set_level
                lvl: 0

  # Handler del endstop abierto:
  # - durante HOMING hacia cerrado: es el endstop contrario, por lo que para y marca FAULT
  # - durante RESTORING/READY: ancla a steps5 y fija nivel 5
  - id: on_open_endstop
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(motion_state) == 1;'
          then:
            - lambda: |-
                const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                id(motor).set_target(id(motor).current_position);
                id(motion_fault) = true;
                id(motion_state) = 3;
                id(motion_state_since_ms) = now;
                id(last_auto_ms) = now;
                ESP_LOGE("ENDSTOP", "ABIERTO activado durante HOMING a cerrado -> FAULT");
          else:
            - if:
                condition:
                  lambda: 'return id(motion_fault) || id(motion_state) == 3;'
                then:
                  - lambda: |-
                      id(motor).set_target(id(motor).current_position);
                      ESP_LOGW("ENDSTOP", "ABIERTO ignorado: movimiento en FAULT");
                else:
                  - lambda: |-
                      const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                      id(last_auto_ms) = now;
                      ESP_LOGW("ENDSTOP", "ABIERTO activado (motion_state=%d) -> anchor a 5", id(motion_state));

                  - script.execute:
                      id: anchor_steps
                      steps: !lambda 'return atoi("${steps_level_5}");'

                  - script.execute:
                      id: set_level
                      lvl: 5

                  - lambda: |-
                      if (id(motion_state) == 2) {
                        id(motion_state) = 0;
                        ESP_LOGW("BOOT", "Restore completado por endstop abierto -> READY");
                      }

# -------------------- Binary sensors --------------------
binary_sensor:
  - platform: template
    id: remote_discharge_status
    name: "Descarga remota habilitada"
    lambda: |-
      return id(remote_discharge_enabled);

  - platform: template
    id: motion_fault_status
    name: "Fallo de movimiento"
    device_class: problem
    lambda: |-
      return id(motion_fault);

  - platform: gpio
    id: endstop_closed
    name: "Endstop Cerrado"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: ${endstop_debounce}
    on_press:
      then:
        - script.execute: on_closed_endstop

  - platform: gpio
    id: endstop_open
    name: "Endstop Abierto"
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: ${endstop_debounce}
    on_press:
      then:
        - script.execute: on_open_endstop

# -------------------- Display SH1106 --------------------
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 0
    update_interval: 3s
    lambda: |-
      // --- 1. TEMPERATURAS (Lado Izquierdo) ---
      if (id(temp_used_external).has_state()) {
        it.printf(0, 0, id(font_big), "%.1f°C", id(temp_used_external).state);
      }

      if (id(temp_used_internal).has_state()) {
        it.printf(0, 18, id(font_small), "Ladrillos: %.1f°C", id(temp_used_internal).state);
      } else {
        it.printf(0, 18, id(font_small), "Ladrillos: --");
      }
      if (id(operating_mode).current_option() == "AUTO_REMOTO") {
        if (id(remote_setpoint_valid)) {
          it.printf(0, 30, id(font_small), "Objetivo: %.1f°C", id(remote_temp_target));
        } else {
          it.printf(0, 30, id(font_small), "Objetivo: --");
        }
      } else {
        it.printf(0, 30, id(font_small), "Objetivo: %.1f°C", id(temp_target).state);
      }

      // --- 2. ICONO TRAMPILLA (Derecha) ---
      it.rectangle(95, 0, 30, 45);

      float pct = id(open_percent).has_state() ? id(open_percent).state : 0.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      int gap = (int)((pct / 100.0f) * 36);

      it.line(97, 40 - gap, 123, 40 - gap);
      it.line(97, 41 - gap, 123, 41 - gap);
      it.printf(95, 15, id(font_small), "%3.0f%%", pct);

      // --- 3. BARRA DE ESTADO ---
      it.line(0, 50, 127, 50);
      const char* mode_txt = "MAN";
      if (id(operating_mode).current_option() == "AUTO_LOCAL") mode_txt = "AL ";
      if (id(operating_mode).current_option() == "AUTO_REMOTO") mode_txt = "AR ";
      const char* dbg_txt  = id(debug_mode) ? "DEBUG" : "REAL";
      it.printf(0, 52, id(font_small), "%s | %s | MQ:%s",
                mode_txt, dbg_txt, id(mqtt_client)->is_connected() ? "ON" : "OFF");

# -------------------- Sensores temperatura --------------------
one_wire:
  - platform: gpio
    pin: GPIO22

sensor:
  - platform: dallas_temp
    name: "Temperatura Ladrillos (real)"
    id: temp_ladrillos
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      - offset: 0.2
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
    on_value:
      then:
        - lambda: |-
            const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
            if (isnan(x)) {
              id(last_temp_ladrillos_valid_ms) = 0;
              if (!id(debug_mode)) {
                id(temp_used_internal).publish_state(NAN);
                id(last_temp_internal_valid_ms) = 0;
              }
              return;
            }

            id(last_temp_ladrillos_valid_ms) = now;
            if (!id(debug_mode)) {
              id(temp_used_internal).publish_state(x);
              id(last_temp_internal_valid_ms) = now;
            }
        - script.execute: update_stored_soc

  - platform: dht
    pin: GPIO10
    model: DHT22
    temperature:
      id: temp_room
      name: "Temperatura Habitación (real)"
      accuracy_decimals: 1
      filters:
        - offset: -1
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1
      on_value:
        then:
          - lambda: |-
              const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
              if (isnan(x)) {
                id(last_temp_room_valid_ms) = 0;
                if (!id(debug_mode)) {
                  id(temp_used_external).publish_state(NAN);
                  id(last_temp_external_valid_ms) = 0;
                }
                return;
              }

              id(last_temp_room_valid_ms) = now;
              if (!id(debug_mode)) {
                id(temp_used_external).publish_state(x);
                id(last_temp_external_valid_ms) = now;
              }
    humidity:
      id: humidity_room
      name: "Humedad Habitación (real)"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1
    update_interval: 10s

  - platform: template
    name: "Temperatura ambiente usada"
    id: temp_used_external
    accuracy_decimals: 1

  - platform: template
    name: "Temperatura ladrillos usada"
    id: temp_used_internal
    accuracy_decimals: 1

  - platform: template
    name: "Nivel Descarga (reportado)"
    id: level_reported
    accuracy_decimals: 0

  - platform: template
    name: "% Apertura (real)"
    id: open_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      const int steps5 = atoi("${steps_level_5}");
      if (steps5 <= 0) return 0.0f;

      float pct = ((float) id(motor).current_position * 100.0f) / steps5;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return lroundf(pct);

  - platform: template
    name: "Carga acumulador (%)"
    id: stored_soc_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    name: "Temperatura objetivo remota"
    id: remote_temp_target_sensor
    accuracy_decimals: 1

# -------------------- Stepper NEMA17 + TMC2209 (STEP/DIR) --------------------
stepper:
  - platform: a4988
    id: motor
    step_pin: GPIO19
    dir_pin: GPIO20

    # En TMC2209 el pin es EN (ENABLE) en lugar de SLEEP.
    # ESPHome usa "sleep_pin" para dormir al terminar; en TMC hay que INVERTIRLO.
    # Con esto replicas tu "sleep_when_done: true" (se deshabilita al llegar al target).
    sleep_pin:
      number: GPIO18
      inverted: true

    max_speed: 250 steps/s
    acceleration: 600 steps/s^2
    deceleration: 600 steps/s^2

# -------------------- Controles HA --------------------
switch:
  - platform: template
    name: "Debug (usar Fake Temp)"
    id: debug_switch
    lambda: |-
      return id(debug_mode);
    turn_on_action:
      - lambda: |-
          id(debug_mode) = true;
          id(temp_used_external).publish_state(id(fake_external_temp).state);
          id(temp_used_internal).publish_state(id(fake_internal_temp).state);
          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          id(last_temp_external_valid_ms) = now;
          id(last_temp_internal_valid_ms) = now;
          ESP_LOGW("CTRL", "DEBUG ON");
    turn_off_action:
      - lambda: |-
          id(debug_mode) = false;
          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          if (id(temp_room).has_state() && !isnan(id(temp_room).state)) {
            id(temp_used_external).publish_state(id(temp_room).state);
            id(last_temp_external_valid_ms) = now;
          } else {
            id(temp_used_external).publish_state(NAN);
            id(last_temp_external_valid_ms) = 0;
          }
          if (id(temp_ladrillos).has_state() && !isnan(id(temp_ladrillos).state)) {
            id(temp_used_internal).publish_state(id(temp_ladrillos).state);
            id(last_temp_internal_valid_ms) = now;
          } else {
            id(temp_used_internal).publish_state(NAN);
            id(last_temp_internal_valid_ms) = 0;
          }
          ESP_LOGW("CTRL", "DEBUG OFF");

select:
  - platform: template
    name: "Modo de funcionamiento"
    id: operating_mode
    icon: "mdi:thermostat-auto"
    optimistic: true
    restore_value: true
    initial_option: "AUTO_LOCAL"
    options:
      - "MANUAL"
      - "AUTO_LOCAL"
      - "AUTO_REMOTO"
    set_action:
      - lambda: |-
          id(last_auto_ms) = 0;
          id(last_telemetry_ms) = 0;
          id(remote_discharge_enabled) = false;
          id(remote_setpoint_valid) = false;
          id(last_remote_message_ms) = 0;
          ESP_LOGW("CTRL", "Modo=%s", x.c_str());

          if (x == "AUTO_REMOTO") {
            id(force_remote_close)->execute();
          }

number:
  - platform: template
    name: "Temperatura objetivo"
    id: temp_target
    min_value: ${temp_target_min}
    max_value: ${temp_target_max}
    step: 0.1
    restore_value: true
    initial_value: ${temp_target_default}
    optimistic: true
    set_action:
      - lambda: |-
          id(last_auto_ms) = 0;

  - platform: template
    name: "Fake Room Temp"
    id: fake_external_temp
    min_value: 10
    max_value: 35
    step: 0.5
    restore_value: true
    initial_value: 21.0
    optimistic: true
    set_action:
      - lambda: |-
          if (id(debug_mode)) {
            id(temp_used_external).publish_state(x);
            id(last_temp_external_valid_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
          }

  - platform: template
    name: "Fake Ladrillos Temp"
    id: fake_internal_temp
    min_value: 20
    max_value: 200
    step: 1
    restore_value: true
    initial_value: 30.0
    optimistic: true
    set_action:
      - lambda: |-
          if (id(debug_mode)) {
            id(temp_used_internal).publish_state(x);
            id(last_temp_internal_valid_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
          }

  - platform: template
    name: "Temperatura ladrillos al 0% de carga"
    id: brick_temp_soc_min
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 300
    step: 1
    restore_value: true
    initial_value: ${brick_temp_soc_min_default}
    optimistic: true
    set_action:
      - script.execute: update_stored_soc

  - platform: template
    name: "Temperatura ladrillos al 100% de carga"
    id: brick_temp_soc_max
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 300
    step: 1
    restore_value: true
    initial_value: ${brick_temp_soc_max_default}
    optimistic: true
    set_action:
      - script.execute: update_stored_soc

  - platform: template
    name: "Nivel Descarga (manual)"
    id: level_manual
    min_value: 0
    max_value: 5
    step: 1
    optimistic: true
    set_action:
      then:
        - lambda: |-
            int lvl = (int) lroundf(x);
            if (lvl < 0) lvl = 0;
            if (lvl > 5) lvl = 5;

            if (id(motion_fault) || id(motion_state) != 0) {
              ESP_LOGW("MANUAL", "Ignorado: movimiento no disponible");
              id(level_manual).publish_state(id(saved_level));
              return;
            }

            if (id(operating_mode).current_option() != "MANUAL") {
              ESP_LOGW("MANUAL", "Ignorado: modo=%s (pedido=%d)", id(operating_mode).current_option().c_str(), lvl);
              id(level_manual).publish_state(id(saved_level));
              return;
            }

            id(set_level)->execute(lvl);

  - platform: template
    name: "Periodo control automático"
    id: auto_period_in_seconds
    unit_of_measurement: "s"
    min_value: 10
    max_value: 300
    step: 5
    restore_value: true
    initial_value: 30
    optimistic: true
    set_action:
      - lambda: |-
          id(last_auto_ms) = 0;

  - platform: template
    name: "Periodo telemetría MQTT"
    id: mqtt_telemetry_period_in_seconds
    unit_of_measurement: "s"
    min_value: 5
    max_value: 600
    step: 5
    restore_value: true
    initial_value: 30
    optimistic: true
    set_action:
      - lambda: |-
          id(last_telemetry_ms) = 0;

button:
  - platform: template
    name: "Marcar posición actual como Nivel 0"
    icon: "mdi:target"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(motion_fault) || id(motion_state) != 0 || id(operating_mode).current_option() != "MANUAL";'
            then:
              - lambda: 'ESP_LOGW("MANUAL", "Ignorado: requiere modo MANUAL y motor listo");'
            else:
              - script.execute:
                  id: anchor_steps
                  steps: 0
              - script.execute:
                  id: set_level
                  lvl: 0

  - platform: template
    name: "Ir a Nivel 0 (cerrado)"
    icon: "mdi:arrow-collapse"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(motion_fault) || id(motion_state) != 0 || id(operating_mode).current_option() != "MANUAL";'
            then:
              - lambda: 'ESP_LOGW("MANUAL", "Ignorado: requiere modo MANUAL y motor listo");'
            else:
              - script.execute:
                  id: set_level
                  lvl: 0

  - platform: template
    name: "Ir a Nivel 5 (máximo)"
    icon: "mdi:arrow-expand"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(motion_fault) || id(motion_state) != 0 || id(operating_mode).current_option() != "MANUAL";'
            then:
              - lambda: 'ESP_LOGW("MANUAL", "Ignorado: requiere modo MANUAL y motor listo");'
            else:
              - script.execute:
                  id: set_level
                  lvl: 5

  - platform: template
    name: "Recalibrar (Homing a Cerrado)"
    icon: "mdi:home-import-outline"
    on_press:
      then:
        - lambda: |-
            int lvl = id(saved_level);
            if (lvl < 0) lvl = 0;
            if (lvl > 5) lvl = 5;
            id(boot_restore_level) = lvl;

            id(motion_fault) = false;
            id(motion_state) = 1;
            id(motion_state_since_ms) = (uint32_t)(millis() & 0xFFFFFFFF);

            ESP_LOGW("HOME", "Recalibrar: homing a cerrado y restauro nivel=%d", lvl);
        - script.execute: home_to_closed

# -------------------- Supervisión de homing/restore + AUTO control --------------------
interval:
  # Watchdog de movimiento: libera lock cuando termina restore (o por timeout)
  - interval: 250ms
    then:
      - lambda: |-
          if (id(motion_state) == 0 || id(motion_fault)) return;

          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          const uint32_t elapsed = now - id(motion_state_since_ms);
          const uint32_t timeout_ms = (uint32_t)(atoi("${motion_timeout_s}") * 1000UL);

          // Si estamos RESTORING y llegamos al target, liberamos.
          if (id(motion_state) == 2) {
            if (id(motor).current_position == id(motor).target_position) {
              id(motion_state) = 0;
              id(last_auto_ms) = now;
              ESP_LOGW("BOOT", "Restore completado -> READY (lvl=%d)", id(saved_level));
              return;
            }
          }

          // Timeout seguridad (para HOMING o RESTORING)
          if (elapsed > timeout_ms) {
            ESP_LOGE("BOOT", "Timeout motion_state=%d (%ums). Paro motor; requiere recalibracion.", id(motion_state), (unsigned)elapsed);
            id(motor).set_target(id(motor).current_position);  // stop suave
            id(motion_fault) = true;
            id(motion_state) = 3;  // FAULT: nunca se desbloquea sin homing correcto
            id(last_auto_ms) = now;
          }

  # Expiración del permiso remoto: obliga al controlador a renovar sus órdenes.
  - interval: 1s
    then:
      - lambda: |-
          if (id(operating_mode).current_option() != "AUTO_REMOTO") return;
          if (!id(remote_discharge_enabled) && !id(remote_setpoint_valid)) return;

          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          const uint32_t timeout_ms = (uint32_t)(atoi("${remote_lease_timeout_s}") * 1000UL);
          if (timeout_ms == 0 ||
              (id(last_remote_message_ms) != 0 && now - id(last_remote_message_ms) <= timeout_ms)) {
            return;
          }

          id(remote_discharge_enabled) = false;
          id(remote_setpoint_valid) = false;
          id(last_remote_message_ms) = 0;
          id(last_auto_ms) = 0;
          ESP_LOGW("MQTT", "Lease remoto expirado: cierro y espero nuevas ordenes");
          id(force_remote_close)->execute();

  # Control automático 0..5, local o remoto
  - interval: 1s
    then:
      - lambda: |-
          if (id(motion_state) != 0 || id(motion_fault)) return;

          const bool auto_local = id(operating_mode).current_option() == "AUTO_LOCAL";
          const bool auto_remote = id(operating_mode).current_option() == "AUTO_REMOTO";
          if (!auto_local && !auto_remote) return;

          if (auto_remote && (!id(remote_discharge_enabled) || !id(remote_setpoint_valid))) {
            id(force_remote_close)->execute();
            return;
          }

          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          const uint32_t period_ms = (uint32_t) lroundf(id(auto_period_in_seconds).state * 1000.0f);

          if (id(last_auto_ms) != 0) {
            const uint32_t elapsed = now - id(last_auto_ms);
            if (elapsed < period_ms) return;
          }
          id(last_auto_ms) = now;

          const uint32_t temp_timeout_ms = (uint32_t)(atoi("${sensor_stale_timeout_s}") * 1000UL);
          const bool temp_value_valid = id(temp_used_external).has_state() &&
                                        !isnan(id(temp_used_external).state);
          const bool fake_temp_valid = id(debug_mode) && temp_value_valid;
          const bool real_temp_fresh = temp_value_valid &&
                                       id(last_temp_external_valid_ms) != 0 &&
                                       now - id(last_temp_external_valid_ms) <= temp_timeout_ms;
          const bool temp_valid = fake_temp_valid || real_temp_fresh;
          if (!temp_valid) {
            ESP_LOGW("CTRL", "Temperatura ambiente ausente, NaN o caducada: cierro a nivel 0");
            id(set_level)->execute(0);
            return;
          }

          const float T = id(temp_used_external).state;
          const float target = auto_remote ? id(remote_temp_target) : id(temp_target).state;
          if (isnan(target)) {
            ESP_LOGW("CTRL", "Objetivo invalido: cierro a nivel 0");
            id(set_level)->execute(0);
            return;
          }
          const float H  = atof("${hysteresis}");
          const float band = atof("${step_band}");

          int target_level;
          if (T >= target + H) target_level = 0;
          else if (T <= target - H) target_level = 5;
          else {
            float delta = target - T;
            int lvl = 2 + (int) lroundf(delta / band);
            if (lvl < 0) lvl = 0;
            if (lvl > 5) lvl = 5;
            target_level = lvl;
          }

          // Anti-oscilación simple: si ya estamos en ese nivel, no hacemos nada
          if (id(saved_level) == target_level) {
            ESP_LOGD("CTRL", "No muevo: ya estoy en nivel=%d", target_level);
            return;
          }

          ESP_LOGI("CTRL", "Modo=%s T=%.2f Obj=%.2f -> nivel_obj=%d (periodo=%us)",
                   auto_remote ? "AUTO_REMOTO" : "AUTO_LOCAL",
                   T, target, target_level, (unsigned) lroundf(id(auto_period_in_seconds).state));

          id(set_level)->execute(target_level);

  # Telemetría periódica en AUTO_REMOTO
  - interval: 1s
    then:
      - lambda: |-
          if (id(operating_mode).current_option() != "AUTO_REMOTO") return;

          const float configured_period = id(mqtt_telemetry_period_in_seconds).state;
          if (isnan(configured_period) || configured_period <= 0.0f) return;

          const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
          const uint32_t period_ms = (uint32_t) lroundf(configured_period * 1000.0f);

          if (id(last_telemetry_ms) != 0 && now - id(last_telemetry_ms) < period_ms) return;

          id(last_telemetry_ms) = now;
          id(publish_remote_telemetry)->execute();
