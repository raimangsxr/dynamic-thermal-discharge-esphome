substitutions:
  name: "habitaciones"
  friendly_name: "Acumulador Habitaciones Test"
  lan_private_ip: "192.168.11.104"
  #wg_private_ip: "10.8.0.23"

  # ---- Calibración mecánica ----
  steps_level_5: "2500"   # recorrido estimado; solo se usa para buscar los endstops
  debug_step_size: "100"  # pasos por pulsación de los botones de depuración

  # ---- Control térmico ----
  temp_target_default: "21.0"
  temp_target_min: "18"
  temp_target_max: "25"
  hysteresis: "0.4"       # °C (banda muerta)
  step_band: "0.4"        # °C por nivel (agresividad)

  # ---- MQTT ----
  mqtt_setpoint_topic: "telemetria/acumuladores/${name}/setpoint"
  mqtt_discharge_topic: "telemetria/acumuladores/${name}/discharge"
  mqtt_telemetry_topic: "telemetria/acumuladores/${name}/telemetry"

  # ---- Estado de carga térmica ----
  brick_temp_soc_min_default: "20.0"   # 0 % de carga
  brick_temp_soc_max_default: "120.0"  # 100 % de carga; cerca del límite del DS18B20

  # ---- Endstops / Homing ----
  endstop_debounce: "30ms"
  homing_extra_steps: "600"     # “pasos de más” para asegurar tocar el endstop
  motion_timeout_s: "30"        # timeout seguridad para HOMING/RESTORE
  sensor_stale_timeout_s: "60"  # edad máxima admisible de una medida de control
  remote_lease_timeout_s: "90"  # el controlador remoto debe renovar su permiso

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Clamp del último nivel persistido
          int lvl = id(saved_level);
          if (lvl < 0) lvl = 0;
          if (lvl > 5) lvl = 5;
          id(saved_level) = lvl;

          // DEBUG es deliberadamente no persistente, pero inicializamos las
          // señales derivadas por si se activa desde otra automatización.
          if (id(debug_mode)) {
            const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
            id(temp_used_external).publish_state(id(fake_external_temp).state);
            id(temp_used_internal).publish_state(id(fake_internal_temp).state);
            id(last_temp_external_valid_ms) = now;
            id(last_temp_internal_valid_ms) = now;
          }

          ESP_LOGW("BOOT", "Boot: calibro recorrido abierto->cerrado y termino cerrado");

          // Bloquea auto/manual hasta terminar secuencia
          id(motion_state) = 1;  // 0=READY, 1=HOMING, 3=FAULT
          id(motion_state_since_ms) = (uint32_t)(millis() & 0xFFFFFFFF);

      - delay: 500ms
      - script.execute: update_stored_soc
      - script.execute: home_to_closed

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Madrid

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_ap_password
  manual_ip:
    static_ip: ${lan_private_ip}
    gateway: 192.168.11.1
    subnet: 255.255.255.0

captive_portal:

# Reservado para una futura activación de WireGuard.
# wireguard:
#   address: ${wg_private_ip}
#   private_key: !secret wg_private_key_heater
#   peer_endpoint: !secret wg_peer_endpoint
#   peer_port: !secret wg_peer_port
#   peer_public_key: !secret wg_peer_public_key
#   peer_preshared_key: !secret wg_preshared_key_heater
#   peer_allowed_ips:
#     - 10.8.0.0/24
#   peer_persistent_keepalive: !secret wg_peer_persistent_keepalive
#   netmask: 255.255.255.0

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: null
  discovery: false
  reboot_timeout: 0s
  on_connect:
    - lambda: |-
        // La conexión genera un snapshot inmediato. Marcarlo aquí evita que
        // el intervalo de 1 s publique un duplicado en el siguiente tick.
        id(last_telemetry_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
        ESP_LOGI("MQTT", "Conectado al broker");
    - script.execute: publish_telemetry_snapshot
  on_disconnect:
    - lambda: |-
        id(remote_discharge_enabled) = false;
        id(remote_setpoint_valid) = false;
        id(last_remote_message_ms) = 0;
        id(last_auto_ms) = 0;
        id(last_telemetry_ms) = 0;
        ESP_LOGW("MQTT", "Broker desconectado: invalido estado remoto");
    - script.execute: force_remote_close
  on_message:
    - topic: ${mqtt_setpoint_topic}
      qos: 1
      then:
        - lambda: |-
            char *end = nullptr;
            const float value = strtof(x.c_str(), &end);
            while (end != nullptr && (*end == ' ' || *end == '\t' || *end == '\r' || *end == '\n')) {
              end++;
            }

            if (end == x.c_str() || (end != nullptr && *end != '\0') || isnan(value) ||
                value < atof("${temp_target_min}") || value > atof("${temp_target_max}")) {
              id(remote_setpoint_valid) = false;
              id(last_remote_message_ms) = 0;
              ESP_LOGW("MQTT", "Setpoint invalido: '%s'", x.c_str());
              id(last_auto_ms) = 0;
              return;
            }

            id(remote_temp_target) = value;
            id(remote_setpoint_valid) = true;
            id(last_remote_message_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
            id(remote_temp_target_sensor).publish_state(value);
            id(last_auto_ms) = 0;
            ESP_LOGI("MQTT", "Setpoint remoto=%.1f C", value);
        - script.execute: force_remote_close

    - topic: ${mqtt_discharge_topic}
      qos: 1
      then:
        - lambda: |-
            std::string payload = x;
            for (char &c : payload) {
              if (c >= 'a' && c <= 'z') c = (char)(c - 'a' + 'A');
            }

            if (payload == "OFF") {
              id(remote_discharge_enabled) = false;
              id(remote_setpoint_valid) = false;
              id(last_remote_message_ms) = 0;
              id(last_auto_ms) = 0;
              ESP_LOGW("MQTT", "Discharge remoto=OFF");
              return;
            }

            if (payload == "ON") {
              id(remote_discharge_enabled) = true;
              id(last_remote_message_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
              id(last_auto_ms) = 0;
              ESP_LOGI("MQTT", "Discharge remoto=ON (setpoint_valido=%s)",
                       id(remote_setpoint_valid) ? "si" : "no");
              return;
            }

            id(remote_discharge_enabled) = false;
            id(remote_setpoint_valid) = false;
            id(last_remote_message_ms) = 0;
            id(last_auto_ms) = 0;
            ESP_LOGW("MQTT", "Discharge invalido: '%s'", x.c_str());
        - script.execute: force_remote_close

globals:
  # Debug mantiene el comportamiento anterior: sustituye las temperaturas
  # medidas por las temperaturas simuladas.
  - id: debug_mode
    type: bool
    restore_value: false
    initial_value: "false"

  # Estado recibido por MQTT en AUTO_REMOTO.
  - id: remote_discharge_enabled
    type: bool
    restore_value: false
    initial_value: "false"

  - id: remote_setpoint_valid
    type: bool
    restore_value: false
    initial_value: "false"

  - id: remote_temp_target
    type: float
    restore_value: false
    initial_value: "21.0"

  # Momento de la última orden remota válida; evita permisos indefinidos.
  - id: last_remote_message_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Marcas de frescura de las temperaturas usadas.
  - id: last_temp_external_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_temp_internal_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_humidity_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Control AUTO (gating por periodo)
  - id: last_auto_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Telemetría MQTT (gating por periodo)
  - id: last_telemetry_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Último porcentaje publicado; evita repetir el mismo estado en cada ciclo.
  - id: last_open_percent
    type: int
    restore_value: false
    initial_value: "-1"

  # Persistencia de nivel (último nivel comandado)
  - id: saved_level
    type: int
    restore_value: true
    initial_value: "0"

  # Recorrido real entre ambos endstops. Se actualiza en cada homing y se
  # conserva como referencia para poder alcanzar el primer endstop al arrancar.
  - id: calibrated_steps_level_5
    type: int
    restore_value: true
    initial_value: "${steps_level_5}"

  # Fase del homing: 0=buscando abierto, 1=midiendo hacia cerrado.
  - id: homing_phase
    type: int
    restore_value: false
    initial_value: "0"

  # Estado de movimiento:
  # 0=READY, 1=HOMING, 3=FAULT (requiere recalibración)
  - id: motion_state
    type: int
    restore_value: false
    initial_value: "1"

  - id: motion_state_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: motion_fault
    type: bool
    restore_value: false
    initial_value: "false"

# -------------------- Scripts (núcleo de control) --------------------
script:
  # Mueve a un nivel (0..5) + publica estado + persiste saved_level
  - id: set_level
    mode: restart
    parameters:
      lvl: int
    then:
      - lambda: |-
          int level = lvl;
          if (level < 0) level = 0;
          if (level > 5) level = 5;

          if (id(motion_fault) || id(motion_state) == 3) {
            ESP_LOGE("POS", "Movimiento bloqueado: requiere recalibracion");
            return;
          }

          // En AUTO_REMOTO, el estado MQTT remoto tiene prioridad y fuerza
          // el nivel 0 mientras no haya permiso y setpoint válidos.
          if (id(operating_mode).current_option() == "AUTO_REMOTO" &&
              (!id(remote_discharge_enabled) || !id(remote_setpoint_valid))) {
            level = 0;
          }

          const int steps5 = id(calibrated_steps_level_5);
          const int target_steps = (int) lroundf(level * (steps5 / 5.0f));

          ESP_LOGI("POS", "set_level(%d) -> target_steps=%d", level, target_steps);

          id(motor).set_target(target_steps);

          id(saved_level) = level;
          id(level_reported).publish_state(level);
          id(level_manual).publish_state(level);

  # Movimiento relativo para depurar el motor. Un valor positivo abre y uno
  # negativo cierra. Solo está disponible mientras DEBUG está activo y el
  # motor se encuentra READY; no modifica la calibración.
  - id: debug_move_steps
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          if (!id(debug_mode)) {
            ESP_LOGW("DEBUG", "Movimiento ignorado: activa Debug Mode");
            return;
          }

          if (id(motion_fault) || id(motion_state) != 0) {
            ESP_LOGW("DEBUG", "Movimiento ignorado: motor no está READY");
            return;
          }

          const int configured_steps = atoi("${debug_step_size}");
          if (configured_steps <= 0) {
            ESP_LOGE("DEBUG", "debug_step_size debe ser mayor que cero");
            return;
          }

          const int sign = direction < 0 ? -1 : 1;
          if ((sign > 0 && id(endstop_open).state) ||
              (sign < 0 && id(endstop_closed).state)) {
            ESP_LOGW("DEBUG", "Movimiento ignorado: endstop en la dirección solicitada");
            return;
          }

          const long current = (long) id(motor).current_position;
          const long target = current + (long) sign * configured_steps;
          id(motor).set_target((int) target);
          ESP_LOGW("DEBUG", "Movimiento manual: pos=%ld -> target=%ld (%d pasos)",
                   current, target, sign * configured_steps);

  # Fuerza el cierre solo cuando el modo remoto no tiene permiso completo.
  # Durante HOMING dejamos que el motor termine de buscar el final cerrado.
  - id: force_remote_close
    mode: restart
    then:
      - lambda: |-
          if (id(operating_mode).current_option() != "AUTO_REMOTO") return;
          if (id(motion_fault) || id(motion_state) == 3) {
            ESP_LOGE("MQTT", "Cierre remoto bloqueado: requiere recalibracion");
            return;
          }
          if (id(remote_discharge_enabled) && id(remote_setpoint_valid)) return;

          if (id(motion_state) == 1) {
            ESP_LOGW("MQTT", "Cierre remoto pendiente: homing en curso");
            return;
          }

          if (id(motor).current_position != 0 || id(motor).target_position != 0 || id(saved_level) != 0) {
            ESP_LOGW("MQTT", "Cierre remoto forzado");
            id(set_level)->execute(0);
          }

  # Calcula el estado de carga térmica a partir de la temperatura de ladrillos
  # usada (real en modo normal o fake en DEBUG) y de los dos límites
  # configurables en Home Assistant.
  - id: update_stored_soc
    mode: restart
    then:
      - lambda: |-
          if (!id(temp_used_internal).has_state() || isnan(id(temp_used_internal).state)) {
            return;
          }

          const float temp_min = id(brick_temp_soc_min).state;
          const float temp_max = id(brick_temp_soc_max).state;

          if (isnan(temp_min) || isnan(temp_max) || temp_max <= temp_min) {
            ESP_LOGE("SOC", "Limites SOC invalidos: min=%.1f max=%.1f", temp_min, temp_max);
            id(stored_soc_percent).publish_state(NAN);
            return;
          }

          float soc = ((id(temp_used_internal).state - temp_min) / (temp_max - temp_min)) * 100.0f;
          if (soc < 0.0f) soc = 0.0f;
          if (soc > 100.0f) soc = 100.0f;

          id(stored_soc_percent).publish_state(lroundf(soc));

  # Publica un snapshot de telemetría con los valores de temperatura usados.
  # Las temperaturas activas son las que permiten que DEBUG use las fake.
  - id: publish_telemetry_snapshot
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(operating_mode).current_option() == "AUTO_REMOTO";'
          then:
            - if:
                condition:
                  lambda: 'return id(mqtt_client)->is_connected();'
                then:
                  - mqtt.publish_json:
                      topic: ${mqtt_telemetry_topic}
                      qos: 0
                      retain: false
                      payload: |-
                        const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                        const uint32_t timeout_ms =
                            (uint32_t)(atoi("${sensor_stale_timeout_s}") * 1000UL);

                        // Siempre usamos las señales activas: reales en modo
                        // normal y fake cuando DEBUG está habilitado.
                        const bool external_has_state = id(temp_used_external).has_state();
                        const bool external_number_valid =
                            external_has_state && !isnan(id(temp_used_external).state);
                        const bool external_fresh =
                            external_number_valid &&
                            (id(debug_mode) ||
                             (id(last_temp_external_valid_ms) != 0 &&
                              now - id(last_temp_external_valid_ms) <= timeout_ms));

                        const bool internal_has_state = id(temp_used_internal).has_state();
                        const bool internal_number_valid =
                            internal_has_state && !isnan(id(temp_used_internal).state);
                        const bool internal_fresh =
                            internal_number_valid &&
                            (id(debug_mode) ||
                             (id(last_temp_internal_valid_ms) != 0 &&
                              now - id(last_temp_internal_valid_ms) <= timeout_ms));

                        const bool humidity_has_state = id(humidity_room).has_state();
                        const bool humidity_number_valid =
                            humidity_has_state && !isnan(id(humidity_room).state);
                        const bool humidity_fresh =
                            humidity_number_valid && id(last_humidity_valid_ms) != 0 &&
                            now - id(last_humidity_valid_ms) <= timeout_ms;

                        const bool soc_has_state = id(stored_soc_percent).has_state();
                        const bool soc_number_valid =
                            soc_has_state && !isnan(id(stored_soc_percent).state);
                        const bool soc_valid = soc_number_valid && internal_fresh;

                        const std::string mode = id(operating_mode).current_option();
                        const bool local_target_valid = !isnan(id(temp_target).state);
                        const bool remote_target_valid =
                            id(remote_setpoint_valid) && !isnan(id(remote_temp_target));
                        const bool active_target_valid =
                            (mode == "AUTO_LOCAL" && local_target_valid) ||
                            (mode == "AUTO_REMOTO" && remote_target_valid);

                        const char* motion_state_text = "UNKNOWN";
                        switch (id(motion_state)) {
                          case 0: motion_state_text = "READY"; break;
                          case 1: motion_state_text = "HOMING"; break;
                          case 3: motion_state_text = "FAULT"; break;
                        }

                        const char* external_status = "unknown";
                        if (!external_has_state) external_status = "unknown";
                        else if (!external_number_valid) external_status = "invalid";
                        else if (!external_fresh) external_status = "stale";
                        else external_status = "valid";

                        const char* internal_status = "unknown";
                        if (!internal_has_state) internal_status = "unknown";
                        else if (!internal_number_valid) internal_status = "invalid";
                        else if (!internal_fresh) internal_status = "stale";
                        else internal_status = "valid";

                        const char* humidity_status = "unknown";
                        if (!humidity_has_state) humidity_status = "unknown";
                        else if (!humidity_number_valid) humidity_status = "invalid";
                        else if (!humidity_fresh) humidity_status = "stale";
                        else humidity_status = "valid";

                        const char* soc_status = "unavailable";
                        if (!internal_has_state) soc_status = "unknown";
                        else if (!internal_number_valid) soc_status = "invalid";
                        else if (!internal_fresh) soc_status = "stale";
                        else if (!soc_has_state) soc_status = "unknown";
                        else if (!soc_number_valid) soc_status = "invalid";
                        else if (soc_valid) soc_status = "valid";

                        root["schema_version"] = 1;
                        root["mode"] = mode.c_str();
                        root["debug_mode"] = id(debug_mode);
                        root["temperature_source"] = id(debug_mode) ? "FAKE" : "REAL";
                        root["motion_state"] = motion_state_text;
                        root["motion_state_code"] = id(motion_state);
                        root["motion_fault"] = id(motion_fault);
                        root["remote_discharge_enabled"] = id(remote_discharge_enabled);
                        root["remote_setpoint_valid"] = id(remote_setpoint_valid);

                        if (external_fresh) {
                          root["indoor_temperature_c"] =
                              lroundf(id(temp_used_external).state * 10.0f) / 10.0f;
                        } else {
                          root["indoor_temperature_c"] = nullptr;
                        }

                        if (internal_fresh) {
                          root["brick_temperature_c"] =
                              lroundf(id(temp_used_internal).state * 10.0f) / 10.0f;
                        } else {
                          root["brick_temperature_c"] = nullptr;
                        }

                        if (humidity_fresh) {
                          root["humidity_percent"] =
                              lroundf(id(humidity_room).state * 10.0f) / 10.0f;
                        } else {
                          root["humidity_percent"] = nullptr;
                        }

                        if (soc_valid) {
                          root["stored_soc_percent"] =
                              (int) lroundf(id(stored_soc_percent).state);
                        } else {
                          root["stored_soc_percent"] = nullptr;
                        }

                        if (active_target_valid) {
                          const float target = mode == "AUTO_REMOTO"
                              ? id(remote_temp_target)
                              : id(temp_target).state;
                          root["target_temperature_c"] =
                              lroundf(target * 10.0f) / 10.0f;
                        } else {
                          root["target_temperature_c"] = nullptr;
                        }

                        root["damper_level_commanded"] = id(saved_level);
                        root["damper_travel_steps"] = id(calibrated_steps_level_5);

                        const int steps5 = id(calibrated_steps_level_5);
                        if (steps5 > 0) {
                          float damper_pct =
                              ((float) id(motor).current_position * 100.0f) / steps5;
                          if (damper_pct < 0.0f) damper_pct = 0.0f;
                          if (damper_pct > 100.0f) damper_pct = 100.0f;
                          root["damper_position_percent"] = (int) lroundf(damper_pct);
                        } else {
                          root["damper_position_percent"] = nullptr;
                        }

                        root["endstop_closed"] = id(endstop_closed).state;
                        root["endstop_open"] = id(endstop_open).state;

                        root["quality"]["indoor_temperature"] = external_status;
                        root["quality"]["brick_temperature"] = internal_status;
                        root["quality"]["humidity"] = humidity_status;
                        root["quality"]["stored_soc"] = soc_status;
                        root["quality"]["target_temperature"] =
                            mode == "MANUAL" ? "not_applicable"
                            : (active_target_valid ? "valid" : "invalid");
                else:
                  - logger.log:
                      level: DEBUG
                      tag: MQTT
                      format: "Telemetria omitida: MQTT desconectado"

  # Ancla la posición interna del stepper (report_position + set_target) para evitar movimientos raros
  - id: anchor_steps
    mode: restart
    parameters:
      steps: int
    then:
      - lambda: |-
          id(motor).report_position(steps);
          id(motor).set_target(steps);

  # Publica el porcentaje solo cuando cambia; el ciclo de comprobación es de 1 Hz.
  - id: publish_open_percent
    mode: restart
    then:
      - lambda: |-
          const int steps5 = id(calibrated_steps_level_5);
          int pct = 0;
          if (steps5 > 0) {
            float value = ((float) id(motor).current_position * 100.0f) / steps5;
            if (value < 0.0f) value = 0.0f;
            if (value > 100.0f) value = 100.0f;
            pct = (int) lroundf(value);
          }

          if (pct != id(last_open_percent)) {
            id(last_open_percent) = pct;
            id(open_percent).publish_state(pct);
          }

  # Calibra el recorrido completo: primero busca abierto y desde ahí mide hasta
  # cerrado. Acaba siempre en 0 para dejar la trampilla en una posición segura.
  - id: home_to_closed
    mode: restart
    then:
      - lambda: |-
          id(motion_fault) = false;
          id(motion_state) = 1; // HOMING
          id(homing_phase) = 0; // primero buscar ABIERTO
          id(motion_state_since_ms) = (uint32_t)(millis() & 0xFFFFFFFF);
          ESP_LOGW("HOME", "Homing: primero busco el endstop abierto");

      - if:
          condition:
            binary_sensor.is_on: endstop_open
          then:
            - script.execute: on_open_endstop
          else:
            - lambda: |-
                const int estimated = atoi("${steps_level_5}");
                const int calibrated = id(calibrated_steps_level_5);
                const int extra = atoi("${homing_extra_steps}");
                const int travel = std::max(estimated, calibrated) + extra;
                const long current = (long) id(motor).current_position;
                const long target = current + travel;
                ESP_LOGW("HOME", "Buscando abierto: pos=%ld -> target=%ld (%d pasos); cerrado=%s abierto=%s",
                         current, target, travel,
                         id(endstop_closed).state ? "ON" : "OFF",
                         id(endstop_open).state ? "ON" : "OFF");
            - stepper.set_target:
                id: motor
                target: !lambda |-
                  const int estimated = atoi("${steps_level_5}");
                  const int calibrated = id(calibrated_steps_level_5);
                  const int extra = atoi("${homing_extra_steps}");
                  return id(motor).current_position + std::max(estimated, calibrated) + extra;

  # Handler del endstop cerrado:
  # - en la segunda fase de HOMING: calcula el recorrido real y termina en 0
  # - si estamos en normal: ancla a 0 y fija nivel 0 (sin “restore”)
  - id: on_closed_endstop
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(motion_state) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(homing_phase) == 1;'
                then:
                  - lambda: |-
                      const int measured = -id(motor).current_position;
                      if (measured <= 0) {
                        const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                        id(motor).set_target(id(motor).current_position);
                        id(motion_fault) = true;
                        id(motion_state) = 3;
                        id(motion_state_since_ms) = now;
                        id(last_auto_ms) = now;
                        ESP_LOGE("HOME", "Recorrido medido invalido: %d pasos", measured);
                        return;
                      }

                      id(calibrated_steps_level_5) = measured;
                      id(calibrated_travel_sensor).publish_state(measured);
                      ESP_LOGW("HOME", "Cerrado alcanzado: recorrido calibrado=%d pasos", measured);
                  - if:
                      condition:
                        lambda: 'return !id(motion_fault);'
                      then:
                        - script.execute:
                            id: anchor_steps
                            steps: 0
                        - lambda: |-
                            const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                            id(motion_state) = 0;
                            id(saved_level) = 0;
                            id(level_reported).publish_state(0);
                            id(level_manual).publish_state(0);
                            id(last_auto_ms) = now;
                            ESP_LOGW("HOME", "Homing completado -> READY, trampilla cerrada");
                        - script.execute: publish_open_percent
                else:
                  - lambda: |-
                      // Puede ocurrir al arrancar ya apoyado en el endstop cerrado.
                      // La calibración debe continuar hacia abierto.
                      ESP_LOGD("HOME", "Endstop cerrado activo mientras busco abierto; continuo");
          else:
            - lambda: |-
                const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                ESP_LOGW("ENDSTOP", "CERRADO activado (motion_state=%d) -> anchor a 0", id(motion_state));
                id(last_auto_ms) = now;
            - script.execute:
                id: anchor_steps
                steps: 0
            - script.execute:
                id: set_level
                lvl: 0

  # Handler del endstop abierto:
  # - en la primera fase de HOMING: fija el origen temporal y empieza a medir
  #   hacia cerrado
  # - durante la segunda fase: es el endstop contrario y marca FAULT
  # - en READY: ancla al recorrido calibrado y fija nivel 5
  - id: on_open_endstop
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(motion_state) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(homing_phase) == 0;'
                then:
                  - lambda: |-
                      const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                      id(motor).report_position(0);
                      id(motor).set_target(0);
                      id(homing_phase) = 1;
                      id(motion_state_since_ms) = now;
                      ESP_LOGW("HOME", "Abierto alcanzado; mido recorrido hacia cerrado");
                  - stepper.set_target:
                      id: motor
                      target: !lambda |-
                        const int estimated = atoi("${steps_level_5}");
                        const int calibrated = id(calibrated_steps_level_5);
                        const int extra = atoi("${homing_extra_steps}");
                        return -(std::max(estimated, calibrated) + extra);
                else:
                  - lambda: |-
                      const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                      id(motor).set_target(id(motor).current_position);
                      id(motion_fault) = true;
                      id(motion_state) = 3;
                      id(motion_state_since_ms) = now;
                      id(last_auto_ms) = now;
                      ESP_LOGE("ENDSTOP", "ABIERTO reactivado mientras buscaba cerrado -> FAULT");
          else:
            - if:
                condition:
                  lambda: 'return id(motion_fault) || id(motion_state) == 3;'
                then:
                  - lambda: |-
                      id(motor).set_target(id(motor).current_position);
                      ESP_LOGW("ENDSTOP", "ABIERTO ignorado: movimiento en FAULT");
                else:
                  - lambda: |-
                      const uint32_t now = (uint32_t)(millis() & 0xFFFFFFFF);
                      id(last_auto_ms) = now;
                      ESP_LOGW("ENDSTOP", "ABIERTO activado (motion_state=%d) -> anchor a recorrido calibrado", id(motion_state));

                  - script.execute:
                      id: anchor_steps
                      steps: !lambda 'return id(calibrated_steps_level_5);'

                  - script.execute:
                      id: set_level
                      lvl: 5

# -------------------- Binary sensors --------------------
binary_sensor:
  - platform: template
    id: remote_discharge_status
    name: "Descarga remota habilitada"
    lambda: |-
      return id(remote_discharge_enabled);

  - platform: template
    id: motion_fault_status
    name: "Fallo de movimiento"
    device_class: problem
    lambda: |-
      return id(motion_fault);

  - platform: gpio
    id: endstop_closed
    name: "Endstop Cerrado"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: ${endstop_debounce}
    on_press:
      then:
        - script.execute: on_closed_endstop

  - platform: gpio
    id: endstop_open
    name: "Endstop Abierto"
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: ${endstop_debounce}
    on_press:
      then:
        - script.execute: on_open_endstop

# -------------------- Display SH1106 --------------------
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 0
    update_interval: 3s
    lambda: |-
      // --- 1. TEMPERATURAS (Lado Izquierdo) ---
      if (id(temp_used_external).has_state()) {
        it.printf(0, 0, id(font_big), "%.1f°C", id(temp_used_external).state);
      }

      if (id(temp_used_internal).has_state()) {
        it.printf(0, 18, id(font_small), "Ladrillos: %.1f°C", id(temp_used_internal).state);
      } else {
        it.printf(0, 18, id(font_small), "Ladrillos: --");
      }
      if (id(operating_mode).current_option() == "AUTO_REMOTO") {
        if (id(remote_setpoint_valid)) {
          it.printf(0, 30, id(font_small), "Objetivo: %.1f°C", id(remote_temp_target));
        } else {
          it.printf(0, 30, id(font_small), "Objetivo: --");
        }
      } else {
        it.printf(0, 30, id(font_small), "Objetivo: %.1f°C", id(temp_target).state);
      }

      // --- 2. ICONO TRAMPILLA (Derecha) ---
      it.rectangle(95, 0, 30, 45);

      float pct = id(open_percent).has_state() ? id(open_percent).state : 0.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      int gap = (int)((pct / 100.0f) * 36);

      it.line(97, 40 - gap, 123, 40 - gap);
      it.line(97, 41 - gap, 123, 41 - gap);
      it.printf(95, 15, id(font_small), "%3.0f%%", pct);

      // --- 3. BARRA DE ESTADO ---
      it.line(0, 50, 127, 50);
      const char* mode_txt = "MAN";
      if (id(operating_mode).current_option() == "AUTO_LOCAL") mode_txt = "AL ";
      if (id(operating_mode).current_option() == "AUTO_REMOTO") mode_txt = "AR ";
      const char* dbg_txt  = id(debug_mode) ? "DEBUG" : "REAL";
      it.printf(0, 52, id(font_small), "%s | %s | MQ:%s",
                mode_txt, dbg_txt, id(mqtt_client)->is_connected() ? "ON" : "OFF");

# -------------------- Sensores temperatura --------------------
one_wire:
